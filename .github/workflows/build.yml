name: Build VAZ APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Android Project Structure
        run: |
          # Создаем чистый каркас во временной папке
          flutter create --platforms=android --org com.vaz.rev vaz_temp
          # Переносим сгенерированную рабочую папку android
          cp -r vaz_temp/android .
          rm -rf vaz_temp
          # Подтягиваем зависимости
          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaz-turbo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
