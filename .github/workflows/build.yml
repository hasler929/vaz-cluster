name: Build VAZ APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK Cleanly
        run: |
          # 1. Создаем чистый официальный проект Flutter
          flutter create --platforms=android --org com.vaz vaz_app
          cd vaz_app
          
          # 2. Добавляем soundpool через CLI (гарантирует совместимость версий)
          flutter pub add soundpool
          
          # 3. Подменяем main.dart кодом из репозитория
          cp ../lib/main.dart lib/main.dart
          
          # 4. Собираем APK
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaz-turbo-apk
          path: vaz_app/build/app/outputs/flutter-apk/app-release.apk
